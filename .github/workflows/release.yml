# Builds a signed Glow APK for every version tag (v1.4.0 …) and attaches it to a GitHub release, so people can
# install Glow without building it, and Glow's own "Update available" check can find it.
#
# Signing: set two repository secrets (Settings > Secrets and variables > Actions):
#   GLOW_KEYSTORE_B64  the release keystore, base64-encoded (base64 -i glow.keystore | pbcopy)
#   GLOW_KS_PASS       its password
# Without them the build still runs, signed with a throwaway key (fine to try, but it won't install as an
# update over a copy signed with your own key).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-35" >/dev/null

      - name: Version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          case "$TAG" in *[!0-9.]*|"") TAG="0.0.$GITHUB_RUN_NUMBER" ;; esac
          IFS=. read -r MA MI PA <<< "$TAG"
          echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.GLOW_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.GLOW_KS_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > glow.keystore
            echo "GLOW_KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No GLOW_KEYSTORE_B64 secret: signing with a throwaway key."
          fi

      - name: Build
        run: ./build.sh

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/glow.apk "glow-${VERSION_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "glow-${VERSION_NAME}.apk" --title "Glow ${VERSION_NAME}" --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: glow-apk
          path: build/glow.apk
