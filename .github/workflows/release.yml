# Checks that Glow builds on a clean machine (run it from the Actions tab). It doesn't publish anything:
# releases are signed and published from the owner's machine with tools/release.sh, so the signing key never
# leaves it and every release installs as an update over the box's copy.
name: Build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-35" >/dev/null

      - name: Version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          case "$TAG" in *[!0-9.]*|"") TAG="0.0.$GITHUB_RUN_NUMBER" ;; esac
          IFS=. read -r MA MI PA <<< "$TAG"
          echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: glow-apk-unsigned-check
          path: build/glow.apk
